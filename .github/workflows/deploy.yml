name: Deploy CardioVault Department System

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cardiovault-department-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout department-system-v1 source
        uses: actions/checkout@v4
        with:
          repository: mohamedkhalid725-dot/CardioVault-
          ref: department-system-v1
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate CardioVault AI Worker
        working-directory: workers/ai
        run: node --check index.js

      - name: Deploy CardioVault AI Worker
        id: ai_worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: '4'

      - name: Verify CardioVault AI Worker is reachable
        run: |
          status="$(curl -sS -o /tmp/worker-body -w '%{http_code}' https://cardiovault-ai.mohamedkhalid725.workers.dev)"
          echo "Worker HTTP status: $status"
          cat /tmp/worker-body
          test "$status" = "405"

      - name: Route AI Assistant through Cloudflare Worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/aiClinicalService.ts')
          s = p.read_text()

          old_endpoint = "fetch('https://us-central1-ccu-notebook.cloudfunctions.net/analyzeClinicalPatient'"
          if old_endpoint not in s:
              raise SystemExit('Expected Firebase AI Assistant endpoint was not found')
          s = s.replace(old_endpoint, "fetch(getAIEndpoint()", 1)

          s = s.replace(
              "Could not reach the CardioVault AI server. Verify network connection and try again.",
              "AI network request failed. Endpoint: " + "https://cardiovault-ai.mohamedkhalid725.workers.dev",
          )

          p.write_text(s)
          PY

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev

      - name: Build isolated v12 app with absolute GitHub Pages base
        run: npx vite build --base=/CardioVault-Department-System/v12/ --outDir dist-v12
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev

      - name: Publish isolated v12 app
        run: |
          rm -rf dist/v12
          mkdir -p dist/v12
          cp -R dist-v12/. dist/v12/

      - name: Verify builds
        run: |
          test -f dist/index.html
          test -f dist/v12/index.html
          grep -q '/CardioVault-Department-System/v12/' dist/v12/index.html
          test -n "$(find dist/v12/assets -type f -print -quit)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
