name: Deploy CardioVault Department System

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cardiovault-department-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout department-system-v1 source
        uses: actions/checkout@v4
        with:
          repository: mohamedkhalid725-dot/CardioVault-
          ref: department-system-v1
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate CardioVault AI Worker
        working-directory: workers/ai
        run: node --check index.js

      - name: Deploy CardioVault AI Worker
        id: ai_worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: '4'

      - name: Verify CardioVault AI Worker is reachable
        run: |
          status="$(curl -sS -o /tmp/worker-body -w '%{http_code}' https://cardiovault-ai.mohamedkhalid725.workers.dev)"
          echo "Worker HTTP status: $status"
          cat /tmp/worker-body
          test "$status" = "405"

      - name: Route AI Assistant through deployed Cloudflare Worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/aiClinicalService.ts')
          s = p.read_text()
          old = "fetch('https://us-central1-ccu-notebook.cloudfunctions.net/analyzeClinicalPatient'"
          new = "fetch(getAIEndpoint()"
          if old not in s:
              raise SystemExit('Expected Firebase AI Assistant endpoint was not found in aiClinicalService.ts')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev

      - name: Verify build
        run: test -f dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
