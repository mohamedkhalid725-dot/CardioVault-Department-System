# Fix jsPDF addImage argument order rebuild
name: Deploy CardioVault Department System
# Fresh source rebuild: 045cf2d PDF readability, section shapes, and PDF.js preview

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cardiovault-department-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Source is intentionally pulled from the canonical department-system-v1 branch.
      - name: Checkout department-system-v1 source
        uses: actions/checkout@v4
        with:
          repository: mohamedkhalid725-dot/CardioVault-
          ref: department-system-v1
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate CardioVault AI Worker
        working-directory: workers/ai
        run: node --check index.js
      - name: Deploy Firestore rules
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured in this repository; skipping Firestore rules deployment."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx firebase-tools@latest deploy --only firestore:rules --project ccu-notebook --non-interactive --config firebase.json

      - name: Deploy CardioVault AI Worker (diagnostic Gemini errors)
        id: ai_worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: '4'

      - name: Verify CardioVault AI Worker after CORS preflight fix
        run: |
          set -euxo pipefail
          get_status="$(curl -sS -o /tmp/worker-get-body -w '%{http_code}' https://cardiovault-ai.mohamedkhalid725.workers.dev)"
          echo "GET status: $get_status"
          cat /tmp/worker-get-body
          test "$get_status" = "405"

          options_status="$(curl -sS -o /tmp/worker-options-body -w '%{http_code}' -X OPTIONS https://cardiovault-ai.mohamedkhalid725.workers.dev)"
          echo "OPTIONS status: $options_status"
          test "$options_status" = "204"

          post_status="$(curl -sS -o /tmp/worker-post-body -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"patient":{}}' https://cardiovault-ai.mohamedkhalid725.workers.dev)"
          echo "Unauthenticated POST status: $post_status"
          cat /tmp/worker-post-body
          test "$post_status" = "401"

      - name: Replace AI Assistant with verified Worker client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/services/aiClinicalService.ts")
          source = path.read_text(encoding="utf-8")
          marker = "export async function callAIAssistant"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("callAIAssistant marker not found")
          brace = source.find("{", start)
          depth = 0
          end = None
          for i in range(brace, len(source)):
              if source[i] == "{":
                  depth += 1
              elif source[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("callAIAssistant closing brace not found")

          replacement = (
              'export async function callAIAssistant(req: AIAssistantRequest): Promise<AIAssistantResponse> {\n'
              '  const endpoint = getAIEndpoint();\n'
              '  if (!endpoint) throw new Error("AI configuration error: CardioVault AI endpoint is empty.");\n'
              '  let token: string;\n'
              '  try { token = await getFirebaseIdToken(); } catch (error) {\n'
              '    throw new Error("AI authentication error: " + (error instanceof Error ? error.message : String(error)));\n'
              '  }\n'
              '  let response: Response;\n'
              '  try {\n'
              '    response = await fetch(endpoint, {\n'
              '      method: "POST",\n'
              '      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },\n'
              '      body: JSON.stringify({ patient: req.patient, assistantTask: req.task, draftType: req.draftType, userPrompt: req.userPrompt, imageBase64: req.imageBase64 || undefined }),\n'
              '    });\n'
              '  } catch (error) {\n'
              '    throw new Error("AI network error [" + endpoint + "]: " + (error instanceof Error ? error.message : String(error)));\n'
              '  }\n'
              '  let payload: any = {};\n'
              '  try { payload = await response.json(); } catch (error) {\n'
              '    throw new Error("AI response error [" + endpoint + "]: " + (error instanceof Error ? error.message : String(error)));\n'
              '  }\n'
              '  if (!response.ok) throw new Error("AI server error [" + response.status + "]: " + String(payload?.error || ("HTTP " + response.status)));\n'
              '  const text = [\n'
              '    payload?.diagnosticAnalysis ? "Clinical synthesis:\\n" + payload.diagnosticAnalysis : "",\n'
              '    Array.isArray(payload?.differentialDiagnoses) && payload.differentialDiagnoses.length ? "Differential considerations:\\n" + payload.differentialDiagnoses.map((d: any) => "• " + d.diagnosis + ": " + d.rationale + " [" + d.urgency + "]").join("\\n") : "",\n'
              '    Array.isArray(payload?.recommendedActions) && payload.recommendedActions.length ? "Suggested clinician-review actions:\\n" + payload.recommendedActions.map((x: any) => "• " + x).join("\\n") : "",\n'
              '    Array.isArray(payload?.safetyChecks) && payload.safetyChecks.length ? "Safety checks:\\n" + payload.safetyChecks.map((x: any) => "• " + x).join("\\n") : "",\n'
              '    Array.isArray(payload?.missingData) && payload.missingData.length ? "Missing/uncertain data:\\n" + payload.missingData.map((x: any) => "• " + x).join("\\n") : "",\n'
              '  ].filter(Boolean).join("\\n\\n");\n'
              '  return { text: text || "No clinical synthesis returned.", task: req.task, draftType: req.draftType, disclaimer: "AI-generated clinical assistance. Verify against the patient record, current guidelines and clinical judgment before acting.", timestamp: new Date().toISOString() };\n'
              '}\n'
          )

          updated = source[:start] + replacement + source[end:]
          if "us-central1-ccu-notebook.cloudfunctions.net/analyzeClinicalPatient" in updated:
              raise SystemExit("Old Firebase AI endpoint is still present")
          if "Could not reach the CardioVault AI server. Verify network connection" in updated:
              raise SystemExit("Old generic AI network error is still present")
          path.write_text(updated, encoding="utf-8")
          print("Verified Worker client installed.")
          PY

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev

      - name: Build isolated v12 app with absolute GitHub Pages base
        run: npx vite build --base=/CardioVault-Department-System/v12/ --outDir dist-v12
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev

      - name: Publish isolated v12 app
        run: |
          rm -rf dist/v12
          mkdir -p dist/v12
          cp -R dist-v12/. dist/v12/

      - name: Build fresh v13 app to bypass browser-cached v12 assets
        run: npx vite build --base=/CardioVault-Department-System/v13/ --outDir dist-v13
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev

      - name: Publish fresh v13 app
        run: |
          rm -rf dist/v13
          mkdir -p dist/v13
          cp -R dist-v13/. dist/v13/

      - name: Build fresh v14 app with resilient Team Directory fallback
        run: npx vite build --base=/CardioVault-Department-System/v14/ --outDir dist-v14
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev
      - name: Publish fresh v14 app
        run: |
          rm -rf dist/v14
          mkdir -p dist/v14
          cp -R dist-v14/. dist/v14/
      - name: Verify builds
        run: |
          test -f dist/index.html
          test -f dist/v12/index.html
          test -f dist/v13/index.html
          test -f dist/v14/index.html
          grep -q '/CardioVault-Department-System/v12/' dist/v12/index.html
          grep -q '/CardioVault-Department-System/v13/' dist/v13/index.html
          grep -q '/CardioVault-Department-System/v14/' dist/v14/index.html
          test -n "$(find dist/v13/assets -type f -print -quit)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# Refresh canonical department-system-v1 source build
# Include latest Team Directory and Firestore-shared Tasks fixes
# Rebuild after task cloud synchronization and shared task rules
# Source resilient Team Directory fallback rebuild
# Publish v14 to bypass any cached v13 entrypoint
