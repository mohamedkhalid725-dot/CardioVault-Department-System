name: Deploy CardioVault Department System

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cardiovault-department-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout department-system-v1 source
        uses: actions/checkout@v4
        with:
          repository: mohamedkhalid725-dot/CardioVault-
          ref: department-system-v1
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate CardioVault AI Worker
        working-directory: workers/ai
        run: node --check index.js

      - name: Deploy CardioVault AI Worker
        id: ai_worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: '4'

      - name: Verify CardioVault AI Worker is reachable
        run: |
          status="$(curl -sS -o /tmp/worker-body -w '%{http_code}' https://cardiovault-ai.mohamedkhalid725.workers.dev)"
          echo "Worker HTTP status: $status"
          cat /tmp/worker-body
          test "$status" = "405"

      - name: Replace AI Assistant with the verified Worker client
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/aiClinicalService.ts')
          s = p.read_text()

          start = s.index('export async function callAIAssistant')
          end = len(s)
          prefix = s[:start]

          replacement = r'''export async function callAIAssistant(req: AIAssistantRequest): Promise<AIAssistantResponse> {
  let token: string;
  try {
    token = await getFirebaseIdToken();
  } catch (error) {
    const detail = error instanceof Error ? error.message : String(error);
    throw new Error('AI authentication error: ' + detail);
  }

  const endpoint = getAIEndpoint();
  let response: Response;
  try {
    response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify({
        patient: req.patient,
        assistantTask: req.task,
        draftType: req.draftType,
        userPrompt: req.userPrompt,
        imageBase64: req.imageBase64 || undefined,
      }),
    });
  } catch (error) {
    const detail = error instanceof Error ? error.message : String(error);
    throw new Error('AI network error [' + endpoint + ']: ' + detail);
  }

  let payload: any = {};
  try {
    payload = await response.json();
  } catch (error) {
    const detail = error instanceof Error ? error.message : String(error);
    throw new Error('AI response error [' + endpoint + ']: ' + detail);
  }

  if (!response.ok) {
    const message = String(payload?.error || `HTTP ${response.status} from CardioVault AI`);
    throw new Error('AI server error [' + response.status + ']: ' + message);
  }

  const text = [
    payload?.diagnosticAnalysis ? `Clinical synthesis:\n${payload.diagnosticAnalysis}` : '',
    Array.isArray(payload?.differentialDiagnoses)&&payload.differentialDiagnoses.length ? `Differential considerations:\n${payload.differentialDiagnoses.map((d:any)=>`• ${d.diagnosis}: ${d.rationale} [${d.urgency}]`).join('\n')}` : '',
    Array.isArray(payload?.recommendedActions)&&payload.recommendedActions.length ? `Suggested clinician-review actions:\n${payload.recommendedActions.map((x:any)=>`• ${x}`).join('\n')}` : '',
    Array.isArray(payload?.safetyChecks)&&payload.safetyChecks.length ? `Safety checks:\n${payload.safetyChecks.map((x:any)=>`• ${x}`).join('\n')}` : '',
    Array.isArray(payload?.missingData)&&payload.missingData.length ? `Missing/uncertain data:\n${payload.missingData.map((x:any)=>`• ${x}`).join('\n')}` : '',
  ].filter(Boolean).join('\n\n');

  return {
    text: text || 'No clinical synthesis returned.',
    task: req.task,
    draftType: req.draftType,
    disclaimer: 'AI-generated clinical assistance. Verify against the patient record, current guidelines and clinical judgment before acting.',
    timestamp: new Date().toISOString(),
  };
}
'''
          p.write_text(prefix + replacement)
          PY

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev

      - name: Build isolated v12 app with absolute GitHub Pages base
        run: npx vite build --base=/CardioVault-Department-System/v12/ --outDir dist-v12
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev

      - name: Publish isolated v12 app
        run: |
          rm -rf dist/v12
          mkdir -p dist/v12
          cp -R dist-v12/. dist/v12/

      - name: Verify builds
        run: |
          test -f dist/index.html
          test -f dist/v12/index.html
          grep -q '/CardioVault-Department-System/v12/' dist/v12/index.html
          test -n "$(find dist/v12/assets -type f -print -quit)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
