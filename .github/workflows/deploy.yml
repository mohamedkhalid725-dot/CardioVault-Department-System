name: Deploy CardioVault Department System

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cardiovault-department-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout department-system-v1 source
        uses: actions/checkout@v4
        with:
          repository: mohamedkhalid725-dot/CardioVault-
          ref: department-system-v1
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate CardioVault AI Worker
        working-directory: workers/ai
        run: node --check index.js

      - name: Deploy CardioVault AI Worker
        id: ai_worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: '4'

      - name: Verify deployed AI Worker network and CORS
        env:
          AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev
        run: |
          set -euo pipefail
          echo "Testing OPTIONS: $AI_ENDPOINT"
          curl -sS -D /tmp/headers -o /tmp/body -X OPTIONS "$AI_ENDPOINT"
          cat /tmp/headers
          grep -qi '^access-control-allow-origin: \*' /tmp/headers
          echo "Testing unauthenticated POST: expected HTTP 401"
          status="$(curl -sS -o /tmp/post-body -w '%{http_code}' -X POST "$AI_ENDPOINT" \
            -H 'Origin: https://mohamedkhalid725-dot.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"patient":{}}')"
          echo "POST status: $status"
          cat /tmp/post-body
          test "$status" = "401"
          echo "AI Worker network/CORS endpoint is reachable and enforcing Firebase authentication."

      - name: Route AI Assistant through Cloudflare Worker and expose runtime error
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/aiClinicalService.ts')
          s = p.read_text()
          old = "fetch('https://us-central1-ccu-notebook.cloudfunctions.net/analyzeClinicalPatient'"
          new = "fetch(getAIEndpoint()"
          if old not in s:
              raise SystemExit('Expected Firebase AI Assistant endpoint was not found in aiClinicalService.ts')
          s = s.replace(old, new, 1)
          old_catch = """  } catch {
    throw new Error('Could not reach the CardioVault AI server. Verify network connection and try again.');
  }"""
          new_catch = """  } catch (error) {
    const detail = error instanceof Error ? error.message : String(error);
    throw new Error('AI network error [' + getAIEndpoint() + ']: ' + detail);
  }"""
          if old_catch not in s:
              raise SystemExit('Expected AI Assistant network catch block was not found')
          s = s.replace(old_catch, new_catch, 1)
          p.write_text(s)
          PY

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CARDIOVAULT_AI_ENDPOINT: https://cardiovault-ai.mohamedkhalid725.workers.dev

      - name: Verify build
        run: test -f dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
